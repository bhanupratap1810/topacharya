<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us – TopAcharya</title>
  <link rel="icon" type="image/jpeg" href="images/logo.jpeg">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
  <div class="navbar-inner">

    <a href="index.html" class="brand">
      <img src="images/logo.jpeg" alt="TopAcharya Logo">
      <span>TOPACHARYA</span>
    </a>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="mentors.html">Find Mentors</a>
      <a href="about.html">About Us</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

    <button class="hamburger" id="hamburger">
      <i class="fas fa-bars"></i>
    </button>

  </div>
</header>

<!-- ================= MAIN ================= -->
<main>

  <!-- ===== PAGE HEADER ===== -->
  <section class="page-header page-header--soft">
    <h1>Contact Us</h1>
    <p>
      Have questions or want to become an Acharya?  
      We’d love to hear from you.
    </p>
  </section>

  <!-- ===== CONTACT CARD ===== -->
  <section class="contact-section">

    <div class="contact-card">

      <!-- CONTACT FORM -->
      <form class="contact-form" novalidate>

        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" name="name" placeholder="Your Name" required>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" name="email" placeholder="Your Email" required>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-message"></i>
          <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn primary full">
          Send Message
        </button>

      </form>

      <!-- CONTACT INFO -->
      <aside class="contact-info">
        <h3>Reach Us</h3>

        <ul>
          <li>
            <i class="fa-solid fa-envelope"></i>
            support@topacharya.com
          </li>
          <li>
            <i class="fa-solid fa-phone"></i>
            +91 98765 43210
          </li>
          <li>
            <i class="fa-solid fa-location-dot"></i>
            India
          </li>
        </ul>
      </aside>

    </div>

  </section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="site-footer">
  <p>© 2026 TopAcharya. All rights reserved.</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
